apiVersion: apps/v1
kind: Deployment
metadata:
  name: xkops-backend
  labels:
    app: xkops-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xkops-backend
  template:
    metadata:
      labels:
        app: xkops-backend
    spec:
      containers:
      - name: query-container
        image: hamzaarshad10/querybackend:1.6.2  # Replace with your actual image
        ports:
        - containerPort: 5000  # Replace with your actual port if needed
        env:
        - name: MONGODB_HOSTNAME
          value: "mongodb-0.mongodb-headless.default.svc.cluster.local"  # Replace with your actual MongoDB service name or endpoint
        - name: MONGODB_PORT
          value: "27017"  # Default MongoDB port
        - name: MONGODB_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-secrets
              key: mongodb-root-username
        - name: MONGODB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secrets
              key: mongodb-root-password
        - name: MONGODB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: mongodb-config
              key: mongoInitDbDatabase #values.yaml