apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: helmfile-installation-manager
rules:
  # Permissions to create and list namespaces
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list"] 

  # Permissions to list secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create"]  

  # Permissions to manage CustomResourceDefinitions (CRDs)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create", "get", "list", "watch"]  

  # Permissions to manage ServiceAccounts in all namespaces
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create"]  

  # Permissions to manage ConfigMaps in the 'robusta' namespace
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create"]  # Adjust verbs as necessary (e.g., add "create" if needed)

  # Permissions to access ClusterRoles
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["get", "list"]  # Allow reading cluster roles

  # Permissions to manage ClusterRoleBindings
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "list", "watch"]  # Add permissions to manage clusterrolebindings

  # Permissions to manage Services in all namespaces
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "delete"]  # Added permissions for services

 # Permissions to manage Deployments in all namespaces
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete"]  # Added permissions for deployments

  # Permissions to manage ServiceMonitors in all namespaces
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "watch", "create", "delete"]  # Added permissions for ServiceMonitors

  # Permissions to manage OperatorGroups in all namespaces
  - apiGroups: ["operators.coreos.com"]
    resources: ["operatorgroups"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # Permissions to list and get StatefulSets in all namespaces
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list"]

  # Permissions to get Roles in the pixie namespace
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    verbs: ["get"]
    resourceNames: ["pl-deleter-role"]  # Specific Role in the pixie namespace

  # Permissions to get RoleBindings in the pixie namespace
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get"]
    resourceNames: ["pl-deleter-binding"]  # Specific RoleBinding in the pixie namespace

  # Permissions to get CatalogSources in the px-operator namespace
  - apiGroups: ["operators.coreos.com"]
    resources: ["catalogsources"]
    verbs: ["get"]
    resourceNames: ["pixie-operator-index"]  # Specific CatalogSource in the px-operator namespace

  # Permissions to get Subscriptions in the px-operator namespace
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions"]
    verbs: ["get"]
    resourceNames: ["pixie-operator-subscription"]  # Specific Subscription in the px-operator namespace

  # Permissions to get Viziers in the pixie namespace
  - apiGroups: ["px.dev"]
    resources: ["viziers"]
    verbs: ["get"]
    resourceNames: ["pixie"]  # Specific Vizier in the pixie namespace

# Permissions to create, get, list, and delete ClusterRoles at the cluster scope
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["*"]  # Grant all permissions on clusterroles and clusterrolebindings

# Permissions to create Roles in all namespaces
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    verbs: ["create"]  # Allow creating Roles in all namespaces

# Kubecost: Permissions for managing PersistentVolumes (Kubecost specific)
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]

# Kubecost: Permissions for managing PersistentVolumeClaims in the kubecost namespace
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]

# Kubecost: Permissions for managing Roles in the kubecost namespace
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    verbs: ["get", "list", "watch", "create", "delete"]

# Kubecost: Permissions for managing RoleBindings in the kubecost namespace
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "delete"]

# Kubecost: Permissions for updating ConfigMaps and managing Pods/Log in the kubecost namespace
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["update"]

# Kubecost: Permissions for getting, listing, and watching Pods/Log in the kubecost namespace
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]